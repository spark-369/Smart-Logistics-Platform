<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1565c0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Smart Logistics Platform — manage shipments, drivers, vehicles and real-time tracking."
    />
    <meta name="color-scheme" content="light dark" />
    <!-- Discourage search engines from indexing an internal operations tool. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Smart Logistics Platform</title>
    <style>
      /*
       * Inline first-paint styles.
       *
       * These are applied before the JS bundle loads so the user never sees an unstyled white
       * flash. Colours mirror theme/tokens.js (background.default for both schemes).
       */
      html {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        background-color: #f4f6fb;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #0b1220;
        }
      }
      /* Splash shown until React mounts and replaces it. */
      #initial-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        font-family: 'Inter', 'Roboto', 'Helvetica', 'Arial', sans-serif;
        color: #5b6b86;
      }
      @media (prefers-color-scheme: dark) {
        #initial-splash {
          color: #9aa8c0;
        }
      }
      #initial-splash .ring {
        width: 38px;
        height: 38px;
        border: 3px solid rgba(21, 101, 192, 0.25);
        border-top-color: #1565c0;
        border-radius: 50%;
        animation: slp-spin 0.8s linear infinite;
      }
      @keyframes slp-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #initial-splash .ring {
          animation-duration: 2.4s;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-splash">
        <div class="ring" role="status" aria-label="Loading Smart Logistics Platform"></div>
        <span>Loading Smart Logistics Platform…</span>
      </div>
    </div>
    <noscript>
      <div style="padding: 32px; font-family: sans-serif; text-align: center">
        <h1>JavaScript is required</h1>
        <p>
          The Smart Logistics Platform is a single-page application and needs JavaScript enabled.
          Please enable it or contact your platform administrator.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
