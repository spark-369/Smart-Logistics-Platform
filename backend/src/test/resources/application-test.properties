# ================================================================================================
# Test profile - self contained, no external services required.
# Every test runs against an in-memory H2 database in PostgreSQL compatibility mode.
# ================================================================================================

# --- Database (H2 in-memory, PostgreSQL compatibility so production DDL types such as TEXT work) ---
spring.datasource.url=jdbc:h2:mem:slp_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# --- JPA ---
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# --- JWT (64 byte key, satisfies the HS256 minimum) ---
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration=3600000

# --- Server ---
server.port=0

# --- Security / CORS ---
app.cors.allowed-origins=http://localhost:5173
app.actuator.enabled=false

# --- Tests seed their own users, so the first-run bootstrap must stay out of the way ---
app.bootstrap.admin.enabled=false

# --- Quieter logs ---
logging.level.root=WARN
logging.level.com.slp.backend=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
